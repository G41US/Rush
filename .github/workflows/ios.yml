name: Build IPA (unsigned)
on:
  push:
    paths-ignore: ["unity/**", ".github/workflows/unity.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Bundle body tracker offline
        run: |
          mkdir -p www/mp && cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs www/mp/ && cp -r node_modules/@mediapipe/tasks-vision/wasm www/mp/
          curl -sSL -o www/mp/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
      - run: npx cap add ios
      - name: Camera permission + keep awake
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Camera tracks your moves to control the runner.'" $P
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P
      - run: npx cap sync ios
      - name: Build
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr RailRush-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: rail-rush-ipa, path: RailRush-unsigned.ipa }
