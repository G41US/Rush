name: Build APK
on:
  push:
    paths-ignore: ["unity/**", ".github/workflows/unity.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Bundle body tracker offline
        run: |
          mkdir -p www/mp && cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs www/mp/ && cp -r node_modules/@mediapipe/tasks-vision/wasm www/mp/
          curl -sSL -o www/mp/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
      - run: npx cap add android
      - name: Camera permission + cast plugin
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          D=android/app/src/main/java/com/marvelous/railrush
          cp native/android/*.java $D/
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: rail-rush-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
